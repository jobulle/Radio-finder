<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadioFinder</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111827;
}

main{
  max-width:700px;
  margin:auto;
  padding:30px 18px;
}

h1{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

.search{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:12px;
  font-size:16px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-size:16px;
  cursor:pointer;
  background:#111827;
  color:white;
}

#status{
  margin:15px 0;
  color:#666;
}

.station{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.station-name{
  font-weight:700;
  font-size:18px;
  margin-bottom:6px;
}

.station-info{
  color:#666;
  font-size:14px;
  margin-bottom:12px;
}

audio{
  width:100%;
}
</style>
</head>

<body>

<main>

<h1>RADIOFINDER</h1>

<div class="subtitle">
Trouve une radio et écoute son direct
</div>

<div class="search">
<input
  id="search"
  type="text"
  placeholder="Artiste ou titre"
  value="Daft Punk"
>
<button onclick="searchRadios()">Rechercher</button>
</div>

<div id="status"></div>
<div id="results"></div>

</main>

<script>

let currentAudio = null;

async function getApiServer(){

  const servers = [
    "https://de1.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://at1.api.radio-browser.info"
  ];

  for(const server of servers){

    try{
      const response = await fetch(
        server + "/json/stations/search?countrycode=FR&hidebroken=true&limit=20&order=clicktrend"
      );

      if(response.ok){
        return server;
      }

    }catch(e){}
  }

  return null;
}


async function searchRadios(){

  const results = document.getElementById("results");
  const status = document.getElementById("status");

  results.innerHTML = "";
  status.textContent = "Recherche de radios françaises...";

  const server = await getApiServer();

  if(!server){

    status.textContent =
      "Impossible de contacter Radio Browser.";

    return;
  }

  try{

    const response = await fetch(
      server +
      "/json/stations/search?countrycode=FR&hidebroken=true&limit=20&order=clicktrend"
    );

    const stations = await response.json();

    status.textContent =
      stations.length + " radios françaises trouvées.";

    stations.forEach(station => {

      if(!station.url_resolved) return;

      const div = document.createElement("div");

      div.className = "station";

      div.innerHTML = `

        <div class="station-name">
          ${escapeHtml(station.name || "Radio")}
        </div>

        <div class="station-info">
          ${escapeHtml(station.codec || "")}
          ${station.bitrate ? " • " + station.bitrate + " kbps" : ""}
        </div>

        <button>
          Écouter
        </button>

      `;

      const button = div.querySelector("button");

      button.onclick = async () => {

        if(currentAudio){

          currentAudio.pause();
          currentAudio.remove();

        }

        const audio = document.createElement("audio");

        audio.controls = true;
        audio.autoplay = true;
        audio.src = station.url_resolved;

        div.appendChild(audio);

        currentAudio = audio;

        try{

          await fetch(
            server +
            "/json/url/" +
            station.stationuuid
          );

        }catch(e){}

      };

      results.appendChild(div);

    });

  }catch(error){

    console.error(error);

    status.textContent =
      "Erreur pendant la recherche.";

  }
}


function escapeHtml(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

searchRadios();

</script>

</body>
</html>
