<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadioFinder</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    color: #111827;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 30px 18px;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #6b7280;
}

.search {
    display: flex;
    gap: 8px;
    margin: 25px 0;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 17px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 16px;
    background: #111827;
    color: white;
    font-weight: bold;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin: 12px 0;
}

.live {
    color: red;
    font-weight: bold;
    font-size: 13px;
}

.title {
    font-size: 18px;
    font-weight: bold;
    margin: 8px 0;
}

.radio {
    color: #6b7280;
    margin-bottom: 12px;
}

.note {
    margin-top: 25px;
    color: #6b7280;
    font-size: 13px;
}
</style>
</head>

<body>

<main>

<h1>RADIOFINDER</h1>

<div class="subtitle">
Trouve un artiste sur les radios
</div>

<div class="search">

<input
    id="artist"
    value="Daft Punk"
    placeholder="Rechercher un artiste">

<button onclick="search()">
Rechercher
</button>

</div>

<div id="status"></div>

<div id="results"></div>

<div class="note">
Prototype RadioFinder V1.
Les radios affichées sont actuellement des données de démonstration.
</div>

</main>

<script>

const demo = [

{
    radio: "Station de démonstration A",
    title: "One More Time"
},

{
    radio: "Station de démonstration B",
    title: "Get Lucky"
},

{
    radio: "Station de démonstration C",
    title: "Around the World"
}

];

function search() {

    const artist =
        document.getElementById("artist").value.trim();

    const results =
        document.getElementById("results");

    const status =
        document.getElementById("status");

    if (!artist) {

        status.textContent =
            "Saisis un artiste.";

        results.innerHTML = "";

        return;
    }

    status.textContent =
        "Recherche...";

    results.innerHTML = "";

    setTimeout(function() {

        status.textContent =
            demo.length + " stations trouvées";

        results.innerHTML =
            demo.map(function(station) {

                return `
                <div class="card">

                    <div class="live">
                        ● EN DIRECT — DÉMO
                    </div>

                    <div class="title">
                        ${artist} — ${station.title}
                    </div>

                    <div class="radio">
                        ${station.radio}
                    </div>

                    <button onclick="listen()">
                        ▶ Écouter
                    </button>

                </div>
                `;

            }).join("");

    }, 500);
}

function listen() {

    alert(
        "Le lecteur radio réel sera connecté dans la prochaine étape."
    );

}

</script>

</body>
</html>
